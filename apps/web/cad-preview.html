<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aftermath CAD preview</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1a1f18; color: #e8efe0; font: 14px/1.4 system-ui, sans-serif; }
      #ui { position: fixed; top: 12px; left: 12px; z-index: 2; background: rgba(18,22,15,.85); padding: 10px 12px; border-radius: 8px; max-width: 420px; }
      #ui select, #ui button { margin: 4px 4px 0 0; }
      #hud { opacity: .85; margin-top: 8px; white-space: pre-wrap; }
      canvas { width: 100%; height: 100%; display: block; outline: none; }
      a { color: #9fd18a; }
    </style>
  </head>
  <body>
    <div id="ui">
      <div><strong>CAD preview</strong> · does not change Walk</div>
      <label>Asset
        <select id="asset"></select>
      </label>
      <button type="button" id="reload">Reload</button>
      <div id="hud">Loading…</div>
      <div><a href="./">← back to game</a></div>
    </div>
    <canvas id="c"></canvas>
    <script type="module" src="/src/cad-preview.ts"></script>
  </body>
</html>
